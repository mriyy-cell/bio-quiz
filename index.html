<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生物基礎 一問一答</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --blue: #3b82f6;
            --blue-dark: #2563eb;
            --card-bg: #ffffff;
            --text-main: #334155;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 520px;
            width: 100%;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            border: 4px solid #334155;
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* 統一メインタイトル */
        h1#main-title {
            font-size: 1.6rem;
            color: #0f172a;
            margin-top: 5px;
            margin-bottom: 15px;
            font-weight: 800;
            position: relative;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 6px 0;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }

        .btn-primary { background-color: var(--primary); color: white; box-shadow: 0 4px 0 var(--primary-dark); }
        .btn-blue { background-color: var(--blue); color: white; width: 100%; box-shadow: 0 4px 0 var(--blue-dark); }
        .btn-logout { background-color: #ef4444; color: white; font-size: 0.85rem; padding: 8px 16px; border-radius: 12px; }

        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: #475569; }
        .form-group input, .form-group select { 
            width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 12px; 
            box-sizing: border-box; font-size: 1rem; font-family: inherit; outline: none; background: #fff;
        }

        /* 🧪 デバッグパネル */
        #debug-panel {
            background: #000; color: #00ffcc; padding: 10px; border-radius: 12px;
            margin-bottom: 15px; font-size: 0.8rem; font-weight: bold; display: none;
            border: 1px solid #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.3);
        }
        #debug-panel button {
            padding: 5px 8px; margin: 2px; font-size: 0.75rem; border-radius: 6px;
            border: none; cursor: pointer; font-weight: bold; background: #334155; color: white;
        }
        #debug-panel button:hover { background: #00ffcc; color: black; }

        /* =========================================================
           🔥 COD武器迷彩風・アニメーション演出（常時演出のみ）
        ========================================================= */

        /* --- 🥇 1. GOLD (ゴールド迷彩) --- */
        .camo-gold {
            background: linear-gradient(110deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            filter: drop-shadow(0 2px 4px rgba(212, 175, 55, 0.5));
        }

        /* --- 💎 2. DIAMOND (ダイヤモンド迷彩) --- */
        .camo-diamond {
            background: linear-gradient(135deg, #e0f2fe 0%, #38bdf8 25%, #ffffff 50%, #818cf8 75%, #e0f2fe 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: diamondGlow 2s ease-in-out infinite alternate;
        }
        .camo-diamond::after {
            content: "💎✨";
            position: absolute; right: -35px; top: -10px; font-size: 1.2rem;
            animation: floatDiamond 1.5s ease-in-out infinite alternate;
        }

        /* --- 🌌 3. DARK MATTER (ダークマター迷彩) --- */
        .camo-darkmatter {
            background: linear-gradient(45deg, #4c1d95, #c026d3, #0284c7, #f43f5e, #4c1d95);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: magma 4s ease infinite;
            filter: drop-shadow(0 0 8px rgba(192, 38, 211, 0.8));
        }

        /* --- 🌈 4. ORION / INTERSTELLAR (オリオン・極限迷彩) --- */
        .camo-orion {
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bf7, #ff00c8, #ff0000);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowFlow 2s linear infinite;
            font-size: 1.8rem !important;
            filter: drop-shadow(0 0 12px rgba(0, 255, 213, 0.8));
        }

        /* 👑 カード外枠の迷彩化 */
        .frame-gold { border-color: #ffd700 !important; box-shadow: 0 0 20px rgba(255, 215, 0, 0.6) !important; }
        .frame-diamond { border-color: #38bdf8 !important; box-shadow: 0 0 25px rgba(56, 189, 248, 0.7) !important; }
        .frame-darkmatter { border-color: #c026d3 !important; box-shadow: 0 0 30px rgba(192, 38, 211, 0.8) !important; }
        .frame-orion { border-color: #00ffd5 !important; box-shadow: 0 0 35px rgba(0, 255, 213, 0.9) !important; }

        /* アニメーション定義 */
        @keyframes shine { to { background-position: 200% center; } }
        @keyframes diamondGlow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        @keyframes magma { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes rainbowFlow { 0% { background-position: 0% 0%; } 100% { background-position: 400% 0%; } }
        @keyframes floatDiamond { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-8px) rotate(15deg); } }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-container-box">
    <!-- 🧪 隠しデバッグコントロール (dキー3回連打で表示) -->
    <div id="debug-panel">
        <div>🧪 デバッグ: 👑数切り替え</div>
        <div style="margin-top: 6px;">
            <button onclick="applyTitleDecorationByCount(0)">0: Normal</button>
            <button onclick="applyTitleDecorationByCount(1)">1: Gold</button>
            <button onclick="applyTitleDecorationByCount(2)">2: Diamond</button>
            <button onclick="applyTitleDecorationByCount(3)">3: DarkMatter</button>
            <button onclick="applyTitleDecorationByCount(4)">4: Orion 🌈</button>
        </div>
    </div>

    <!-- 👑 メインタイトル -->
    <h1 id="main-title">🧬 生物基礎 一問一答 🔬</h1>

    <!-- 1. 認証エリア -->
    <div id="auth-section">
        <p id="user-status" style="color: #94a3b8; font-weight: 700;">読み込み中...</p>
        <button id="login-btn" class="btn btn-primary" style="display: none;">Googleでログイン</button>
        <button id="logout-btn" class="btn btn-logout" style="display: none;">ログアウト</button>
    </div>

    <!-- 2. スタート画面 -->
    <div id="start-screen" style="display: none; margin-top: 15px;">
        <button id="view-stats-btn" class="btn btn-blue" style="width: 100%; margin-bottom: 16px;">
            🏆 達成度を確認する
        </button>

        <div style="background-color: #f8fafc; padding: 20px; border-radius: 16px; border: 2px solid #e2e8f0; margin-bottom: 20px;">
            <div class="form-group">
                <label for="select-unit">📚 出題単元を選択</label>
                <select id="select-unit"></select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="select-count">❓ 出題問題数を選択</label>
                <select id="select-count">
                    <option value="10">10問</option>
                    <option value="15">15问</option>
                    <option value="20">20問</option>
                    <option value="all_questions">全問挑戦</option>
                </select>
            </div>
        </div>

        <button id="start-btn" class="btn btn-primary" style="font-size: 1.2rem; padding: 16px 40px; width: 100%;">
            スタート 🕴️
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBDjHDXa7fnOB39WI2D7eC7G_efPKZW6mk",
        authDomain: "bio-quest-5aa22.firebaseapp.com",
        projectId: "bio-quest-5aa22",
        storageBucket: "bio-quest-5aa22.firebasestorage.app",
        messagingSenderId: "114808918613",
        appId: "1:114808918613:web:ad4689c75545faf60dbadc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const mainTitle = document.getElementById("main-title");
    const quizContainerBox = document.getElementById("quiz-container-box");

    /* 👑 👑数を受け取ってデザインを即座に変更する関数 */
    window.applyTitleDecorationByCount = function(crownCount) {
        mainTitle.className = "";
        quizContainerBox.classList.remove("frame-gold", "frame-diamond", "frame-darkmatter", "frame-orion");

        if (crownCount === 1) {
            mainTitle.classList.add("camo-gold");
            quizContainerBox.classList.add("frame-gold");
        } else if (crownCount === 2) {
            mainTitle.classList.add("camo-diamond");
            quizContainerBox.classList.add("frame-diamond");
        } else if (crownCount === 3) {
            mainTitle.classList.add("camo-darkmatter");
            quizContainerBox.classList.add("frame-darkmatter");
        } else if (crownCount >= 4) {
            mainTitle.classList.add("camo-orion");
            quizContainerBox.classList.add("frame-orion");
        }
    };

    /* 🕹️ 隠しキー操作 (「d」を3回連打) */
    let keyStrokeHistory = [];
    document.addEventListener("keydown", (e) => {
        if (e.key.toLowerCase() === "d") {
            const now = Date.now();
            keyStrokeHistory.push(now);
            keyStrokeHistory = keyStrokeHistory.filter(t => now - t < 1000);

            if (keyStrokeHistory.length >= 3) {
                const debugPanel = document.getElementById("debug-panel");
                debugPanel.style.display = (debugPanel.style.display === "none" || debugPanel.style.display === "") ? "block" : "none";
                keyStrokeHistory = [];
            }
        }
    });

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById("user-status").innerText = `ようこそ、${user.displayName} さん！`;
            document.getElementById("auth-section").style.display = "block";
            document.getElementById("start-screen").style.display = "block";
            
            // Firebaseから👑数をチェックして自動反映
            const scoresRef = collection(db, "users", user.uid, "unitScores");
            const querySnapshot = await getDocs(scoresRef);
            let crownCount = 0;
            querySnapshot.forEach(docSnap => {
                if (docSnap.data().scorePercent === 100 && docSnap.data().questionCount === "all_questions") {
                    crownCount++;
                }
            });
            applyTitleDecorationByCount(crownCount);
        }
    });
</script>
</body>
</html>
