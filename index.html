<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生物基礎 一問一答</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 生物系の絵文字を背景で降らせる装飾レイヤー（クイズ操作の対象外） -->
<div class="bio-rain" aria-hidden="true">
    <span>🧬</span><span>🦠</span><span>🌿</span><span>🔬</span><span>🧫</span><span>🌱</span>
    <span>🧬</span><span>🍀</span><span>🦠</span><span>🌻</span><span>🧪</span><span>🌿</span>
    <span>🧫</span><span>🧬</span><span>🌱</span><span>🦋</span><span>🔬</span><span>🦠</span>
    <span>🌿</span><span>🧪</span><span>🧬</span><span>🍃</span><span>🧫</span><span>🌱</span>
</div>

<!-- 🛠️ デバッグコントロールパネル -->
<div id="debug-panel">
    <button id="debug-trigger-btn">🛠️ DBG</button>
    <div id="debug-controls" style="display: none;">
        <span>👑数:</span>
        <select id="debug-crown-select">
            <option value="auto">自動 (Firestore)</option>
            <option value="0">0個 (Default)</option>
            <option value="1">1個 (Forest Lumen)</option>
            <option value="2">2個 (Emerald Crest)</option>
            <option value="3">3個 (Jade Royal)</option>
            <option value="4">4個 (Royal Canopy)</option>
            <option value="5">5個 (Aurora Grove)</option>
            <option value="6">6個 (Mythic Arsenal)</option>
        </select>
    </div>
</div>

<div class="quiz-container" id="main-quiz-container">
    <h1>🧬 生物基礎 一問一答 </h1>

    <!-- 1. 認証エリア -->
    <div id="auth-section">
        <button id="login-btn" class="btn btn-primary" style="display: none;">Googleでログイン</button>
        <p id="login-notice" style="display: none; color: #64748b; font-weight: 700; white-space: pre-line; margin: 0 0 8px;">学校のGoogleアカウントではエラーが発生するため、個人のGoogleアカウントでログインしてください。</p>
        <button id="logout-btn" class="btn btn-logout" style="display: none;">ログアウト</button>
    </div>

    <!-- 2. タイトル（スタート・設定）画面 -->
    <div id="start-screen" style="display: none; margin-top: 20px;">
        <button id="view-stats-btn" class="btn btn-blue" style="width: 100%; margin-bottom: 12px;">
            🏆 達成度を確認する
        </button>

        <!-- タイトルデザイン変更ボタン（王冠1個以上で表示） -->
        <button id="change-theme-btn" class="btn" style="width: 100%; margin-bottom: 16px; background-color: #8b5cf6; color: white; box-shadow: 0 4px 0 #6d28d9; display: none;">
            🎨 タイトルデザイン変更
        </button>

        <div style="background-color: #f8fafc; padding: 20px; border-radius: 16px; border: 2px solid #e2e8f0; margin-bottom: 20px;">
            <div class="form-group">
                <label for="select-unit">📚 出題単元を選択</label>
                <select id="select-unit">
                    <!-- JavaScriptで動的生成 -->
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label for="select-count">❓ 出題問題数を選択</label>
                <select id="select-count">
                    <option value="10">10問</option>
                    <option value="15">15問</option>
                    <option value="20">20問</option>
                    <option value="all_questions">全問挑戦</option>
                </select>
            </div>
        </div>

        <!-- 現在の王冠数と、これまでに獲得した累積ポイントを表示 -->
        <div id="progress-summary" class="progress-summary" aria-label="現在の王冠数とポイント">
            <span id="crown-summary" style="display: none;">👑:<strong id="crown-count-display">0</strong></span>
            <span>pt:<strong id="point-count-display">0</strong></span>
        </div>

        <button id="start-btn" class="btn btn-primary" style="font-size: 1.2rem; padding: 16px 40px; width: 100%;">
            スタート
        </button>
        <p id="user-status" style="color: #64748b; font-weight: 700; white-space: pre-line; margin-bottom: 0;">読み込み中...</p>
    </div>

    <!-- 3. クイズ画面 -->
    <div id="quiz-screen" style="display: none; margin-top: 20px;">
        <div class="quiz-header">
            <div id="question-number">QUESTION 01</div>
            <div id="streak-counter">🔥 0問連続正解中！</div>
        </div>
        <div id="question-text">読み込み中...</div>
        <div id="options-container"></div>
        
        <div id="result-area">
            <div id="result-judge" style="font-weight: 800; font-size: 1.1rem;"></div>
            <div id="result-explanation" style="margin-top: 6px; font-size: 0.95rem; line-height: 1.5;"></div>
        </div>

        <button id="next-btn" class="btn btn-blue" style="display: none; margin-top: 18px;">次の問題へ ➔</button>

        <button id="quit-to-title-btn" class="btn" style="background-color: #94a3b8; color: white; width: 100%; margin-top: 12px; font-size: 0.9rem;">
            タイトルに戻る
        </button>
    </div>

    <!-- 4. 結果・成績送信画面 -->
    <div id="result-screen" style="display: none; margin-top: 20px;">
        <h2 style="margin-top: 0; color: #0f172a; font-weight: 800;">🎉 解答終了！</h2>
        <p id="final-score" style="font-size: 1.5rem; font-weight: 800; color: var(--blue); margin: 15px 0;"></p>
        <!-- 今回のクイズで獲得したポイントを表示 -->
        <p id="earned-points" class="earned-points"></p>

        <!-- 📝 間違えた問題の解答・解説エリア -->
        <div style="background: #f8fafc; padding: 20px; border-radius: 16px; border: 2px solid #e2e8f0; margin-bottom: 20px;">
            <h3 style="margin-top: 0; font-size: 1.1rem; color: #334155; text-align: left;">復習しよう！</h3>
            <div id="wrong-questions-list" class="wrong-questions-container">
                <!-- JavaScriptで動的生成 -->
            </div>
        </div>

        <div style="background: #f8fafc; padding: 20px; border-radius: 16px; border: 2px solid #e2e8f0;">
            <h3 style="margin-top: 0; font-size: 1.1rem; color: #334155;">📋 スコアの提出</h3>
            <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px; font-weight: 700;">必要事項を入力して送信してください。</p>
            
            <div class="form-group">
                <label for="input-grade">学年</label>
                <input type="number" id="input-grade" placeholder="例: 1">
            </div>
            <div class="form-group">
                <label for="input-class">組</label>
                <input type="number" id="input-class" placeholder="例: 2">
            </div>
            <div class="form-group">
                <label for="input-number">出席番号</label>
                <input type="number" id="input-number" placeholder="例: 15">
            </div>
            <div class="form-group">
                <label for="input-name">氏名</label>
                <input type="text" id="input-name" placeholder="例: 山田 太郎">
            </div>

            <button id="submit-score-btn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                スコアを送信する 
            </button>
            <p id="send-status" style="margin-top: 12px; font-weight: 700; font-size: 0.9rem;"></p>
            <button id="result-back-to-title-btn" class="btn" style="width: 100%; margin-top: 12px; background-color: #94a3b8; color: white; box-shadow: 0 4px 0 #64748b;">
                タイトルに戻る
            </button>
        </div>
    </div>

    <!-- 5. 達成度表示モーダル -->
    <div id="stats-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 440px; text-align: left;">
            <h2 style="text-align: center; margin-bottom: 15px;">🏆 単元別 達成度</h2>
            <div id="stats-list-container" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;">
            </div>
            <button id="close-stats-btn" class="btn btn-primary" style="width: 100%;">
                閉じる
            </button>
        </div>
    </div>

    <!-- 6. 送信完了モーダル -->
    <div id="completion-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>🎉 送信完了！</h2>
            <p>提出が完了しました。<br>お疲れ様でした！</p>
            <button id="back-to-title-btn" class="btn btn-primary" style="width: 100%;">
                タイトルに戻る 
            </button>
        </div>
    </div>

    <!-- 7. タイトルデザイン変更モーダル -->
    <div id="theme-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 440px; text-align: left;">
            <h2 style="text-align: center; margin-bottom: 10px;">🎨 デザイン選択</h2>
            <p style="text-align: center; margin-bottom: 15px; font-size: 0.85rem;">獲得した王冠数に応じた迷彩デザインを選択できます。</p>
            <div id="theme-list-container" style="max-height: 320px; overflow-y: auto; margin-bottom: 15px;">
                <!-- JavaScriptで動的生成 -->
            </div>
            <button id="close-theme-btn" class="btn btn-primary" style="width: 100%;">
                閉じる
            </button>
        </div>
    </div>
</div>

<!-- Firebase SDK & クイズ処理 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, setPersistence, browserLocalPersistence, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBDjHDXa7fnOB39WI2D7eC7G_efPKZW6mk",
        authDomain: "bio-quest-5aa22.firebaseapp.com",
        projectId: "bio-quest-5aa22",
        storageBucket: "bio-quest-5aa22.firebasestorage.app",
        messagingSenderId: "114808918613",
        appId: "1:114808918613:web:ad4689c75545faf60dbadc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // アカウント選択後も認証状態を保持し、再読み込みでログイン画面へ戻らないようにする。
    const authPersistence = setPersistence(auth, browserLocalPersistence);

    const mainQuizContainer = document.getElementById("main-quiz-container");
    const authSection = document.getElementById("auth-section");
    const loginNotice = document.getElementById("login-notice");
    const userStatus = document.getElementById("user-status");
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const streakCounter = document.getElementById("streak-counter");
    const selectUnit = document.getElementById("select-unit");
    const selectCount = document.getElementById("select-count");
    
    const statsModal = document.getElementById("stats-modal");
    const viewStatsBtn = document.getElementById("view-stats-btn");
    const closeStatsBtn = document.getElementById("close-stats-btn");
    const statsListContainer = document.getElementById("stats-list-container");
    
    const completionModal = document.getElementById("completion-modal");
    const backToTitleBtn = document.getElementById("back-to-title-btn");
    const resultBackToTitleBtn = document.getElementById("result-back-to-title-btn");
    const submitScoreBtn = document.getElementById("submit-score-btn");
    const quitToTitleBtn = document.getElementById("quit-to-title-btn");

    // デザイン変更要素
    const changeThemeBtn = document.getElementById("change-theme-btn");
    const themeModal = document.getElementById("theme-modal");
    const themeListContainer = document.getElementById("theme-list-container");
    const closeThemeBtn = document.getElementById("close-theme-btn");

    // 🛠️ デバッグ要素
    const debugTriggerBtn = document.getElementById("debug-trigger-btn");
    const debugControls = document.getElementById("debug-controls");
    const debugCrownSelect = document.getElementById("debug-crown-select");
    const DEBUG_PASSWORD = "3094";
    // 正解1問につき加算するポイント。ポイント表示・計算で共通利用する。
    const POINTS_PER_CORRECT_ANSWER = 100;
    const crownSummary = document.getElementById("crown-summary");
    const crownCountDisplay = document.getElementById("crown-count-display");
    const pointCountDisplay = document.getElementById("point-count-display");
    const earnedPointsDisplay = document.getElementById("earned-points");

    let rawUnitsData = [];
    let currentActiveQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let streak = 0;
    let isAnswered = false;
    let isSubmitted = false;
    let currentSelectedCount = "10";
    // 累積ポイントはログインユーザーごとにlocalStorageへ保存する。
    let totalPoints = 0;
    // 結果画面を複数回開いても、同じクイズのポイントを二重加算しないためのフラグ。
    let pointsAddedForCurrentQuiz = false;

    // 📝 間違えた問題を保持する配列
    let wrongQuestions = [];
    
    // 王冠数 & カスタムテーマ管理用変数
    let userCrownCount = 0;
    let currentThemeClass = ""; 

    const CAMO_THEMES = [
        { id: "", name: "デフォルト", reqCrowns: 0, class: "" },
        { id: "camo-forest", name: " Forest Lumen (要王冠1)", reqCrowns: 1, class: "camo-forest" },
        { id: "camo-emerald", name: " Emerald Crest (要王冠2)", reqCrowns: 2, class: "camo-emerald" },
        { id: "camo-jade", name: " Jade Royal (要王冠3)", reqCrowns: 3, class: "camo-jade" },
        { id: "camo-royal", name: " Royal Canopy (要王冠4)", reqCrowns: 4, class: "camo-royal" },
        { id: "camo-aurora", name: " Aurora Grove (要王冠5)", reqCrowns: 5, class: "camo-aurora" },
        { id: "camo-legend", name: " Mythic Arsenal (要王冠6)", reqCrowns: 6, class: "camo-legend" }
    ];

    const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdSS5uTcSPGS5c41e09HNPL3Yad-LaCZOpPI9FbIGsUNqk-1A/formResponse";

    // 🛠️ デバッグボタンクリック時の認証処理
    debugTriggerBtn.addEventListener("click", () => {
        if (debugControls.style.display === "none") {
            const inputPass = prompt("デバッグ用パスワードを入力してください:");
            if (inputPass === DEBUG_PASSWORD) {
                debugControls.style.display = "flex";
            } else if (inputPass !== null) {
                alert("パスワードが違います。");
            }
        } else {
            debugControls.style.display = "none";
        }
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            // ユーザーごとの保存データから累積ポイントを読み込む。
            totalPoints = Number(localStorage.getItem(`bioQuizPoints_${user.uid}`)) || 0;
            updateProgressSummary();
            userStatus.style.whiteSpace = "pre-line";
            userStatus.innerText = `このサイトは宇治山田高校の学校教育の一環として \n使用を許可します。\n塾など、許可していない場合での活用を禁止します。\nログイン中: ${user.displayName}`;
            loginBtn.style.display = "none";
            logoutBtn.style.display = "inline-block";
            loginNotice.style.display = "none";
            authSection.style.display = "block";
            startScreen.style.display = "block";
            loadQuestions().then(() => {
                checkUserCrownsAndApplyTheme();
            });
        } else {
            userStatus.innerText = "🔒 ログインが必要です。";
            loginBtn.style.display = "inline-block";
            loginBtn.disabled = false;
            logoutBtn.style.display = "none";
            loginNotice.style.display = "block";
            authSection.style.display = "block";
            startScreen.style.display = "none";
            quizScreen.style.display = "none";
            resultScreen.style.display = "none";
            totalPoints = 0;
            updateProgressSummary();
            applyThemeClass("");
        }
    });

    function isMobileDevice() {
        return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
            (navigator.maxTouchPoints > 1 && window.matchMedia("(max-width: 768px)").matches);
    }

    function showLoginError(error) {
        console.error("ログインエラー:", error);
        userStatus.innerText = "ログインに失敗しました。通信状態を確認して、もう一度お試しください。";
        loginBtn.disabled = false;
    }

    // モバイルではポップアップがブロックされやすいため、Googleの画面へ遷移して認証する。
    loginBtn.addEventListener("click", async () => {
        loginBtn.disabled = true;
        try {
            if (isMobileDevice()) {
                await signInWithRedirect(auth, provider);
            } else {
                await signInWithPopup(auth, provider);
            }
        } catch (error) {
            showLoginError(error);
        }
    });

    authPersistence
        .catch((error) => console.warn("認証状態の保存設定を適用できませんでした。", error))
        .then(() => getRedirectResult(auth))
        .catch(showLoginError);

    logoutBtn.addEventListener("click", () => signOut(auth));

    async function loadQuestions() {
        try {
            const response = await fetch('./questions.json');
            rawUnitsData = await response.json();
            
            selectUnit.innerHTML = "";

            const allOpt = document.createElement("option");
            allOpt.value = "all";
            allOpt.innerText = "すべての単元（全範囲）";
            selectUnit.appendChild(allOpt);

            if (Array.isArray(rawUnitsData)) {
                rawUnitsData.forEach((unitObj, index) => {
                    const opt = document.createElement("option");
                    opt.value = index;
                    opt.innerText = unitObj.title ? unitObj.title : `単元 ${index + 1}`;
                    selectUnit.appendChild(opt);
                });
            }
        } catch (error) {
            console.error("問題データ読込エラー:", error);
        }
    }

    /* 👑 王冠数のチェック & タイトルデザイン自動決定機能 */
    async function checkUserCrownsAndApplyTheme() {
        const user = auth.currentUser;
        if (!user) return;

        const debugVal = debugCrownSelect.value;
        if (debugVal !== "auto") {
            userCrownCount = parseInt(debugVal, 10);
        } else {
            let crowns = 0;
            try {
                for (let i = 0; i < rawUnitsData.length; i++) {
                    const unitTitle = rawUnitsData[i].title || `単元 ${i + 1}`;
                    const safeUnitKey = unitTitle.replace(/[/\\?%*:|"<>\s]/g, "_");
                    const docRef = doc(db, "users", user.uid, "unitScores", safeUnitKey);
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.scorePercent === 100 && data.questionCount === "all_questions") {
                            crowns++;
                        }
                    }
                }
                userCrownCount = crowns;
            } catch (e) {
                console.error("王冠数確認エラー:", e);
            }
        }

        if (userCrownCount >= 1) {
            changeThemeBtn.style.display = "block";
        } else {
            changeThemeBtn.style.display = "none";
        }

        updateProgressSummary();

        if (debugVal === "auto") {
            try {
                const customThemeRef = doc(db, "users", user.uid, "settings", "theme");
                const customThemeSnap = await getDoc(customThemeRef);

                if (customThemeSnap.exists() && customThemeSnap.data().selectedTheme !== undefined) {
                    const savedTheme = customThemeSnap.data().selectedTheme;
                    const themeObj = CAMO_THEMES.find(t => t.id === savedTheme);
                    if (themeObj && userCrownCount >= themeObj.reqCrowns) {
                        applyThemeClass(themeObj.class);
                        return;
                    }
                }
            } catch(e) { console.error(e); }
        }

        if (userCrownCount >= 6) applyThemeClass("camo-legend");
        else if (userCrownCount === 5) applyThemeClass("camo-aurora");
        else if (userCrownCount === 4) applyThemeClass("camo-royal");
        else if (userCrownCount === 3) applyThemeClass("camo-jade");
        else if (userCrownCount === 2) applyThemeClass("camo-emerald");
        else if (userCrownCount === 1) applyThemeClass("camo-forest");
        else applyThemeClass("");
    }

    debugCrownSelect.addEventListener("change", () => {
        checkUserCrownsAndApplyTheme();
    });

    function applyThemeClass(className) {
        currentThemeClass = className;
        mainQuizContainer.classList.remove("camo-forest", "camo-emerald", "camo-jade", "camo-royal", "camo-aurora", "camo-legend");
        if (className) {
            mainQuizContainer.classList.add(className);
        }
    }

    function updateProgressSummary() {
        // タイトル画面の王冠数・累積ポイント表示を最新の値に更新する。
        crownCountDisplay.innerText = userCrownCount;
        crownSummary.style.display = userCrownCount >= 1 ? "inline" : "none";
        pointCountDisplay.innerText = totalPoints;
    }

    changeThemeBtn.addEventListener("click", () => {
        themeListContainer.innerHTML = "";
        CAMO_THEMES.forEach(t => {
            const isUnlocked = userCrownCount >= t.reqCrowns;
            const div = document.createElement("div");
            div.className = `theme-card ${isUnlocked ? '' : 'locked'}`;
            
            if (t.class) {
                div.classList.add(t.class);
            }

            div.innerHTML = `
                <div>${t.name}</div>
                <div>${isUnlocked ? (currentThemeClass === t.class ? "【適用中】" : "選択") : "🔒 鍵"}</div>
            `;

            if (isUnlocked) {
                div.onclick = async () => {
                    applyThemeClass(t.class);
                    themeModal.style.display = "none";
                    const user = auth.currentUser;
                    if (user && debugCrownSelect.value === "auto") {
                        try {
                            await setDoc(doc(db, "users", user.uid, "settings", "theme"), {
                                selectedTheme: t.id
                            }, { merge: true });
                        } catch(e) { console.error("テーマ保存エラー:", e); }
                    }
                };
            }
            themeListContainer.appendChild(div);
        });
        themeModal.style.display = "flex";
    });

    closeThemeBtn.addEventListener("click", () => {
        themeModal.style.display = "none";
    });

    document.getElementById("start-btn").addEventListener("click", () => {
        currentSelectedCount = selectCount.value;
        prepareQuizPool();

        if (currentActiveQuestions.length === 0) {
            alert("問題が見つかりませんでした。");
            return;
        }

        authSection.style.display = "none";
        startScreen.style.display = "none";
        quizScreen.style.display = "block";
        
        currentQuestionIndex = 0;
        score = 0;
        streak = 0;
        pointsAddedForCurrentQuiz = false;
        earnedPointsDisplay.innerText = "";
        wrongQuestions = []; // 間違えた問題を初期化
        isSubmitted = false;
        showQuestion();
    });

    function prepareQuizPool() {
        const chosenUnitKey = selectUnit.value;
        const chosenCountVal = selectCount.value;

        let pool = [];

        if (chosenUnitKey === "all") {
            if (Array.isArray(rawUnitsData)) {
                rawUnitsData.forEach(unit => {
                    if (unit && unit.questions) {
                        pool = pool.concat(unit.questions);
                    }
                });
            }
        } else {
            const unitIndex = parseInt(chosenUnitKey, 10);
            if (rawUnitsData[unitIndex] && rawUnitsData[unitIndex].questions) {
                pool = [...rawUnitsData[unitIndex].questions];
            }
        }

        pool.sort(() => Math.random() - 0.5);

        if (chosenCountVal !== "all_questions") {
            const limit = parseInt(chosenCountVal, 10);
            pool = pool.slice(0, limit);
        }

        currentActiveQuestions = pool;
    }

    function showQuestion() {
        isAnswered = false;
        const q = currentActiveQuestions[currentQuestionIndex];

        if (!q) return;

        document.getElementById("question-number").innerText = `QUESTION ${String(currentQuestionIndex + 1).padStart(2, '0')} / ${currentActiveQuestions.length}`;
        document.getElementById("question-text").innerText = q.question;
        
        if (streak >= 2) {
            streakCounter.innerText = `🔥 ${streak}問連続正解中！`;
            streakCounter.style.display = "inline-block";
        } else {
            streakCounter.style.display = "none";
        }

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        document.getElementById("result-area").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        if (q.options && Array.isArray(q.options)) {
            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach((optionText, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerHTML = `<span class="key-badge">${index + 1}</span> <span>${optionText}</span>`;
                btn.onclick = () => checkAnswer(optionText, q.answer, q.explanation);
                optionsContainer.appendChild(btn);
            });
        }
    }

    function checkAnswer(selected, correct, explanation) {
        if (isAnswered) return;
        isAnswered = true;

        const currentQ = currentActiveQuestions[currentQuestionIndex];
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(btn => btn.disabled = true);

        const resultArea = document.getElementById("result-area");
        const resultJudge = document.getElementById("result-judge");
        const resultExplanation = document.getElementById("result-explanation");

        if (selected === correct) {
            score++;
            streak++;
            resultArea.className = "result-correct";
            resultJudge.innerText = "⭕ 正解！ Excellent!";
        } else {
            streak = 0;
            resultArea.className = "result-wrong";
            resultJudge.innerText = `❌ 不正解... （正解: ${correct}）`;

            // 📝 不正解の場合、配列に記録
            wrongQuestions.push({
                question: currentQ.question,
                userAnswer: selected,
                correctAnswer: correct,
                explanation: explanation || "解説はありません。"
            });
        }

        if (streak >= 2) {
            streakCounter.innerText = `🔥 ${streak}問連続正解中！`;
            streakCounter.style.display = "inline-block";
        } else {
            streakCounter.style.display = "none";
        }

        resultExplanation.innerText = explanation || "";
        resultArea.style.display = "block";

        const nextBtn = document.getElementById("next-btn");
        if (currentQuestionIndex < currentActiveQuestions.length - 1) {
            nextBtn.innerText = "次の問題へ ➔ (Enter)";
            nextBtn.onclick = handleNextAction;
        } else {
            nextBtn.innerText = "結果を見る ➔ (Enter)";
            nextBtn.onclick = showResultScreen;
        }
        nextBtn.style.display = "block";
    }

    function handleNextAction() {
        if (!isAnswered) return;
        currentQuestionIndex++;
        showQuestion();
    }

    function showResultScreen() {
        quizScreen.style.display = "none";
        const scorePercent = Math.round((score / currentActiveQuestions.length) * 100);
        // 正解数に応じて今回の獲得ポイントを計算する。
        const earnedPoints = score * POINTS_PER_CORRECT_ANSWER;

        if (!pointsAddedForCurrentQuiz) {
            // 結果を表示したタイミングで累積し、次回のタイトル画面にも反映する。
            totalPoints += earnedPoints;
            pointsAddedForCurrentQuiz = true;
            const user = auth.currentUser;
            if (user) {
                // ログアウト後も同じユーザーで続きから使えるよう保存する。
                localStorage.setItem(`bioQuizPoints_${user.uid}`, String(totalPoints));
            }
            updateProgressSummary();
        }

        document.getElementById("final-score").innerText = `スコア: ${score} / ${currentActiveQuestions.length} 問 (${scorePercent}%)`;
        earnedPointsDisplay.innerText = `${earnedPoints}pt獲得`;

        // 📝 間違えた問題の解答・解説をレンダリング
        const wrongListContainer = document.getElementById("wrong-questions-list");
        wrongListContainer.innerHTML = "";

        if (wrongQuestions.length === 0) {
            wrongListContainer.innerHTML = "<p style='color: #10b981; font-weight: 700; text-align: center; margin: 10px 0;'>🎉 全問正解です！素晴らしい！</p>";
        } else {
            wrongQuestions.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "wrong-item";
                div.innerHTML = `
                    <div class="wrong-item-title">Q${index + 1}. ${item.question}</div>
                    <div class="wrong-item-user">あなたの解答: ${item.userAnswer}</div>
                    <div class="wrong-item-answer">正しい解答: ${item.correctAnswer}</div>
                    <div class="wrong-item-explanation">💡 <b>解説:</b> ${item.explanation}</div>
                `;
                wrongListContainer.appendChild(div);
            });
        }

        resultScreen.style.display = "block";

        const selectedUnitText = selectUnit.options[selectUnit.selectedIndex].text;
        if (selectUnit.value !== "all") {
            saveUnitScore(selectedUnitText, scorePercent, currentSelectedCount);
        }
    }

    // イベントリスナー関係
    viewStatsBtn.addEventListener("click", () => showStatsModal());
    closeStatsBtn.addEventListener("click", () => { statsModal.style.display = "none"; });
    submitScoreBtn.addEventListener("click", () => sendScore());
    
    quitToTitleBtn.addEventListener("click", () => {
        const confirmQuit = confirm("クイズを中断してタイトルに戻りますか？\n（現在の進捗は破棄されます）");
        if (confirmQuit) {
            quizScreen.style.display = "none";
            authSection.style.display = "block";
            startScreen.style.display = "block";
        }
    });

    function resetToTitleScreen() {
        completionModal.style.display = "none";
        resultScreen.style.display = "none";
        authSection.style.display = "block";
        startScreen.style.display = "block";

        document.getElementById("input-grade").value = "";
        document.getElementById("input-class").value = "";
        document.getElementById("input-number").value = "";
        document.getElementById("input-name").value = "";

        const statusText = document.getElementById("send-status");
        submitScoreBtn.innerText = "スコアを送信する 🤲";
        submitScoreBtn.disabled = false;
        statusText.innerText = "";

        checkUserCrownsAndApplyTheme();
    }

    backToTitleBtn.addEventListener("click", resetToTitleScreen);
    resultBackToTitleBtn.addEventListener("click", resetToTitleScreen);

    document.addEventListener("keydown", (e) => {
        if (quizScreen.style.display === "block") {
            if (!isAnswered && ["1", "2", "3", "4"].includes(e.key)) {
                const index = parseInt(e.key) - 1;
                const buttons = document.querySelectorAll(".option-btn");
                if (buttons[index]) {
                    buttons[index].click();
                }
            }
            else if (isAnswered && e.key === "Enter") {
                const nextBtn = document.getElementById("next-btn");
                if (nextBtn && nextBtn.style.display !== "none") {
                    nextBtn.click();
                }
            }
        }
        else if (resultScreen.style.display === "block" && e.key === "Enter") {
            if (!isSubmitted) {
                sendScore();
            }
        }
    });

    function sendScore() {
        if (isSubmitted) return;

        const grade = document.getElementById("input-grade").value;
        const classNum = document.getElementById("input-class").value;
        const number = document.getElementById("input-number").value;
        const name = document.getElementById("input-name").value;
        const statusText = document.getElementById("send-status");

        if (!grade || !classNum || !number || !name) {
            alert("学年、組、出席番号、氏名をすべて入力してください。");
            return;
        }

        statusText.style.color = "#3b82f6";
        statusText.innerText = "送信中...";
        submitScoreBtn.disabled = true;

        const scorePercentValue = Math.round((score / currentActiveQuestions.length) * 100);
        const selectedUnitText = selectUnit.options[selectUnit.selectedIndex].text;
        const totalQuestionCount = `${currentActiveQuestions.length}問`;

        const formData = new FormData();
        formData.append("entry.99129247", grade);
        formData.append("entry.1271020973", classNum);
        formData.append("entry.1313275559", number);
        formData.append("entry.1655607218", name);
        formData.append("entry.147621973", `${score} / ${currentActiveQuestions.length}問`);
        formData.append("entry.1382560193", scorePercentValue);
        formData.append("entry.1018835285", selectedUnitText);
        formData.append("entry.1035606462", totalQuestionCount);

        fetch(GOOGLE_FORM_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
        }).then(() => {
            isSubmitted = true;
            statusText.style.color = "#10b981";
            statusText.innerText = "送信が完了しました！";
            submitScoreBtn.innerText = "送信完了";
            submitScoreBtn.disabled = true;

            setTimeout(() => {
                completionModal.style.display = "flex";
            }, 500);

        }).catch(error => {
            console.error("送信エラー:", error);
            statusText.style.color = "#ef4444";
            statusText.innerText = "送信に失敗しました。もう一度試してください。";
            submitScoreBtn.disabled = false;
        });
    }
    
    async function saveUnitScore(unitTitle, scorePercent, questionCount) {
        const user = auth.currentUser;
        if (!user) return;

        const safeUnitKey = unitTitle.replace(/[/\\?%*:|"<>\s]/g, "_");
        const userStatsRef = doc(db, "users", user.uid, "unitScores", safeUnitKey);

        try {
            const docSnap = await getDoc(userStatsRef);
            let previousHigh = 0;

            if (docSnap.exists()) {
                previousHigh = docSnap.data().scorePercent || 0;
            }

            if (scorePercent > previousHigh || (scorePercent === 100 && questionCount === "all_questions")) {
                await setDoc(userStatsRef, {
                    unitTitle: unitTitle,
                    scorePercent: scorePercent,
                    questionCount: questionCount,
                    updatedAt: new Date()
                }, { merge: true });
            }
        } catch (e) {
            console.error("成績保存エラー:", e);
        }
    }

    async function showStatsModal() {
        const user = auth.currentUser;
        if (!user) {
            alert("達成度を確認するにはログインが必要です。");
            return;
        }

        statsListContainer.innerHTML = "<p style='text-align:center;'>読み込み中...</p>";
        statsModal.style.display = "flex";

        try {
            let htmlBuffer = "";

            for (let i = 0; i < rawUnitsData.length; i++) {
                const unitTitle = rawUnitsData[i].title || `単元 ${i + 1}`;
                const safeUnitKey = unitTitle.replace(/[/\\?%*:|"<>\s]/g, "_");
                
                const docRef = doc(db, "users", user.uid, "unitScores", safeUnitKey);
                const docSnap = await getDoc(docRef);

                let icon = "➖";
                let statusText = "未挑戦";
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const score = data.scorePercent || 0;
                    const qCount = data.questionCount || "";
                    
                    if (score === 100 && qCount === "all_questions") {
                        icon = "👑";
                        statusText = "完全マスター!";
                    } else if (score === 100) {
                        icon = "💮";
                        statusText = "100%クリア!";
                    } else if (score >= 80) {
                        icon = "⭕️";
                        statusText = `${score}%`;
                    } else {
                        icon = "💬";
                        statusText = `${score}%`;
                    }
                }
                htmlBuffer += `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #e2e8f0;">
                        <div style="font-weight: 700; font-size: 0.95rem; color: #334155; flex: 1;">${unitTitle}</div>
                        <div style="font-size: 1.2rem; margin: 0 10px;">${icon}</div>
                        <div style="font-weight: 800; font-size: 0.9rem; color: #475569; width: 90px; text-align: right;">${statusText}</div>
                    </div>
                `;
            }

            statsListContainer.innerHTML = htmlBuffer;
        } catch (e) {
            console.error("達成度取得エラー:", e);
            statsListContainer.innerHTML = "<p style='color:red; text-align:center;'>データの読み込みに失敗しました。</p>";
        }
    }
</script>
