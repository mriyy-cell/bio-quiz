<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生物基礎 一問一答</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --blue: #3b82f6;
            --blue-dark: #2563eb;
            --purple: #8b5cf6;
            --purple-dark: #7c3aed;
            --card-bg: #ffffff;
            --text-main: #334155;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 520px;
            width: 100%;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            border: 4px solid #334155;
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        h1#main-title {
            font-size: 1.6rem;
            color: #0f172a;
            margin-top: 5px;
            margin-bottom: 15px;
            font-weight: 800;
            position: relative;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 6px 0;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }

        .btn-primary { background-color: var(--primary); color: white; box-shadow: 0 4px 0 var(--primary-dark); }
        .btn-blue { background-color: var(--blue); color: white; width: 100%; box-shadow: 0 4px 0 var(--blue-dark); }
        .btn-purple { background-color: var(--purple); color: white; width: 100%; box-shadow: 0 4px 0 var(--purple-dark); }
        .btn-logout { background-color: #ef4444; color: white; font-size: 0.85rem; padding: 8px 16px; border-radius: 12px; }

        .form-group { margin-bottom: 14px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: #475569; }
        .form-group input, .form-group select { 
            width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 12px; 
            box-sizing: border-box; font-size: 1rem; font-family: inherit; outline: none; background: #fff;
        }

        /* 🧪 デバッグパネル */
        #debug-panel {
            background: #000; color: #00ffcc; padding: 10px; border-radius: 12px;
            margin-bottom: 15px; font-size: 0.8rem; font-weight: bold; display: none;
            border: 1px solid #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.3);
        }
        #debug-panel button {
            padding: 5px 8px; margin: 2px; font-size: 0.75rem; border-radius: 6px;
            border: none; cursor: pointer; font-weight: bold; background: #334155; color: white;
        }
        #debug-panel button:hover { background: #00ffcc; color: black; }

        /* モーダル基本設定 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }

        .modal-content {
            background: white; padding: 24px; border-radius: 20px;
            text-align: center; max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto;
        }

        /* 👑 COD武器迷彩風・アニメーション */
        .camo-gold {
            background: linear-gradient(110deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            filter: drop-shadow(0 2px 4px rgba(212, 175, 55, 0.5));
        }

        .camo-diamond {
            background: linear-gradient(135deg, #e0f2fe 0%, #38bdf8 25%, #ffffff 50%, #818cf8 75%, #e0f2fe 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: diamondGlow 2s ease-in-out infinite alternate;
            position: relative;
        }
        .camo-diamond::after {
            content: "💎✨";
            position: absolute; right: -35px; top: -10px; font-size: 1.2rem;
            animation: floatDiamond 1.5s ease-in-out infinite alternate;
        }

        .camo-darkmatter {
            background: linear-gradient(45deg, #4c1d95, #c026d3, #0284c7, #f43f5e, #4c1d95);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: magma 4s ease infinite;
            filter: drop-shadow(0 0 8px rgba(192, 38, 211, 0.8));
        }

        .camo-orion {
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bf7, #ff00c8, #ff0000);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowFlow 2s linear infinite;
            font-size: 1.8rem !important;
            filter: drop-shadow(0 0 12px rgba(0, 255, 213, 0.8));
        }

        .frame-gold { border-color: #ffd700 !important; box-shadow: 0 0 20px rgba(255, 215, 0, 0.6) !important; }
        .frame-diamond { border-color: #38bdf8 !important; box-shadow: 0 0 25px rgba(56, 189, 248, 0.7) !important; }
        .frame-darkmatter { border-color: #c026d3 !important; box-shadow: 0 0 30px rgba(192, 38, 211, 0.8) !important; }
        .frame-orion { border-color: #00ffd5 !important; box-shadow: 0 0 35px rgba(0, 255, 213, 0.9) !important; }

        @keyframes shine { to { background-position: 200% center; } }
        @keyframes diamondGlow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        @keyframes magma { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes rainbowFlow { 0% { background-position: 0% 0%; } 100% { background-position: 400% 0%; } }
        @keyframes floatDiamond { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-8px) rotate(15deg); } }

        /* 着せ替え選択の選択肢デザイン */
        .camo-option {
            padding: 12px; margin: 8px 0; border-radius: 12px; border: 2px solid #cbd5e1;
            cursor: pointer; font-weight: bold; text-align: left; display: flex;
            align-items: center; justify-content: space-between; transition: all 0.2s;
        }
        .camo-option:hover { background: #f1f5f9; }
        .camo-option.active { border-color: #3b82f6; background: #eff6ff; }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-container-box">
    <!-- 🧪 隠しデバッグコントロール (dキー3回連打で表示) -->
    <div id="debug-panel">
        <div>🧪 デバッグ: 獲得👑数切り替え</div>
        <div style="margin-top: 6px;">
            <button onclick="setDebugCrowns(0)">0: Normal</button>
            <button onclick="setDebugCrowns(1)">1: Gold</button>
            <button onclick="setDebugCrowns(2)">2: Diamond</button>
            <button onclick="setDebugCrowns(3)">3: DarkMatter</button>
            <button onclick="setDebugCrowns(4)">4: Orion 🌈</button>
        </div>
    </div>

    <!-- 👑 メインタイトル -->
    <h1 id="main-title">🧬 生物基礎 一問一答 🔬</h1>

    <!-- 1. 認証エリア -->
    <div id="auth-section">
        <p id="user-status" style="color: #94a3b8; font-weight: 700;">読み込み中...</p>
        <button id="login-btn" class="btn btn-primary" style="display: none;">Googleでログイン</button>
        <button id="logout-btn" class="btn btn-logout" style="display: none;">ログアウト</button>
    </div>

    <!-- 2. スタート画面 -->
    <div id="start-screen" style="display: none; margin-top: 15px;">
        <button id="view-stats-btn" class="btn btn-blue" style="margin-bottom: 10px;">
            🏆 達成度を確認する
        </button>

        <!-- 🎨 着せ替えボタン（👑1個以上で解放） -->
        <button id="change-theme-btn" class="btn btn-purple" style="display: none; margin-bottom: 16px;">
            🎨 タイトルデザイン変更
        </button>

        <div style="background-color: #f8fafc; padding: 20px; border-radius: 16px; border: 2px solid #e2e8f0; margin-bottom: 20px;">
            <div class="form-group">
                <label for="select-unit">📚 出題単元を選択</label>
                <select id="select-unit">
                    <option value="all">全単元からランダム</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="select-count">❓ 出題問題数を選択</label>
                <select id="select-count">
                    <option value="10">10問</option>
                    <option value="15">15問</option>
                    <option value="20">20問</option>
                    <option value="all_questions">全問挑戦</option>
                </select>
            </div>
        </div>

        <button id="start-btn" class="btn btn-primary" style="font-size: 1.2rem; padding: 16px 40px; width: 100%;">
            スタート 🕴️
        </button>
    </div>
</div>

<!-- 🏆 達成度モーダル -->
<div id="stats-modal" class="modal-overlay">
    <div class="modal-content">
        <h2 style="margin-top:0; color:#1e293b;">🏆 単元別達成度</h2>
        <div id="stats-list" style="text-align: left; margin: 15px 0;">読み込み中...</div>
        <button id="close-stats-btn" class="btn btn-blue" style="width: 100%;">閉じる</button>
    </div>
</div>

<!-- 🎨 デザイン着せ替えモーダル -->
<div id="theme-modal" class="modal-overlay">
    <div class="modal-content">
        <h2 style="margin-top:0; color:#1e293b;">🎨 迷彩カスタマイズ</h2>
        <p style="font-size: 0.85rem; color: #64748b;">解放済みのタイトルデザインを選択できます</p>
        <div id="theme-options-list"></div>
        <button id="close-theme-btn" class="btn btn-purple" style="width: 100%; margin-top: 15px;">保存して閉じる</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBDjHDXa7fnOB39WI2D7eC7G_efPKZW6mk",
        authDomain: "bio-quest-5aa22.firebaseapp.com",
        projectId: "bio-quest-5aa22",
        storageBucket: "bio-quest-5aa22.firebasestorage.app",
        messagingSenderId: "114808918613",
        appId: "1:114808918613:web:ad4689c75545faf60dbadc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const mainTitle = document.getElementById("main-title");
    const quizContainerBox = document.getElementById("quiz-container-box");

    let currentUser = null;
    let userCrownCount = 0;
    let selectedLevel = 0; // ユーザーが選択中のランク(0〜4)

    // 迷彩マスターデータ
    const camoLevels = [
        { level: 0, name: "Standard (ノーマル)", class: "", frame: "" },
        { level: 1, name: "🥇 GOLD CAMO", class: "camo-gold", frame: "frame-gold" },
        { level: 2, name: "💎 DIAMOND CAMO", class: "camo-diamond", frame: "frame-diamond" },
        { level: 3, name: "🌌 DARK MATTER", class: "camo-darkmatter", frame: "frame-darkmatter" },
        { level: 4, name: "🌈 ORION (MASTER)", class: "camo-orion", frame: "frame-orion" }
    ];

    /* 🎨 タイトルデザインの適用 */
    function applyStyleByLevel(level) {
        mainTitle.className = "";
        quizContainerBox.classList.remove("frame-gold", "frame-diamond", "frame-darkmatter", "frame-orion");

        const camo = camoLevels.find(c => c.level === level) || camoLevels[0];
        if (camo.class) mainTitle.classList.add(camo.class);
        if (camo.frame) quizContainerBox.classList.add(camo.frame);

        localStorage.setItem("selected_camo_level", level);
    }

    /* 👑 クラウン数に基づいてUIを更新 */
    function updateCrownUI(crownCount) {
        userCrownCount = crownCount;
        const changeThemeBtn = document.getElementById("change-theme-btn");

        if (crownCount >= 1) {
            changeThemeBtn.style.display = "block";
        } else {
            changeThemeBtn.style.display = "none";
        }

        // 保存された選択レベルを取得、または所持最高レベルを適用
        const savedLevel = localStorage.getItem("selected_camo_level");
        if (savedLevel !== null && parseInt(savedLevel) <= crownCount) {
            selectedLevel = parseInt(savedLevel);
        } else {
            selectedLevel = Math.min(crownCount, 4);
        }

        applyStyleByLevel(selectedLevel);
    }

    /* 🧪 デバッグ操作用 */
    window.setDebugCrowns = function(count) {
        updateCrownUI(count);
    };

    /* 認証状態監視 */
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById("user-status").innerText = `ようこそ、${user.displayName} さん！`;
            document.getElementById("login-btn").style.display = "none";
            document.getElementById("logout-btn").style.display = "inline-flex";
            document.getElementById("start-screen").style.display = "block";

            // 単元データのロード
            await loadUnits();

            // Firebaseから👑数の算出
            const scoresRef = collection(db, "users", user.uid, "unitScores");
            const querySnapshot = await getDocs(scoresRef);
            let crowns = 0;
            querySnapshot.forEach(docSnap => {
                if (docSnap.data().scorePercent === 100 && docSnap.data().questionCount === "all_questions") {
                    crowns++;
                }
            });

            updateCrownUI(crowns);
        } else {
            currentUser = null;
            document.getElementById("user-status").innerText = "ログインしてください";
            document.getElementById("login-btn").style.display = "inline-flex";
            document.getElementById("logout-btn").style.display = "none";
            document.getElementById("start-screen").style.display = "none";
            updateCrownUI(0);
        }
    });

    /* 📚 単元リスト読み込み */
    async function loadUnits() {
        const selectUnit = document.getElementById("select-unit");
        selectUnit.innerHTML = '<option value="all">全単元からランダム</option>';
        try {
            const querySnapshot = await getDocs(collection(db, "questions"));
            const units = new Set();
            querySnapshot.forEach(doc => {
                const data = doc.data();
                if (data.unit) units.add(data.unit);
            });
            units.forEach(unit => {
                const option = document.createElement("option");
                option.value = unit;
                option.textContent = unit;
                selectUnit.appendChild(option);
            });
        } catch (e) {
            console.error("単元データの取得失敗:", e);
        }
    }

    /* 🏆 達成度モーダルの表示 */
    document.getElementById("view-stats-btn").addEventListener("click", async () => {
        if (!currentUser) return;
        const statsList = document.getElementById("stats-list");
        statsList.innerHTML = "読み込み中...";
        document.getElementById("stats-modal").style.display = "flex";

        try {
            const scoresRef = collection(db, "users", currentUser.uid, "unitScores");
            const querySnapshot = await getDocs(scoresRef);
            if (querySnapshot.empty) {
                statsList.innerHTML = "<p>まだ記録がありません。</p>";
                return;
            }

            let html = "<ul style='padding-left: 20px; margin: 0;'>";
            querySnapshot.forEach(docSnap => {
                const data = docSnap.data();
                const crown = (data.scorePercent === 100 && data.questionCount === "all_questions") ? " 👑" : "";
                html += `<li style="margin-bottom: 8px;"><strong>${docSnap.id}</strong>: 最高正解率 ${data.scorePercent}%${crown}</li>`;
            });
            html += "</ul>";
            statsList.innerHTML = html;
        } catch (e) {
            statsList.innerHTML = "<p>データの取得に失敗しました。</p>";
        }
    });

    document.getElementById("close-stats-btn").addEventListener("click", () => {
        document.getElementById("stats-modal").style.display = "none";
    });

    /* 🎨 デザイン変更モーダルの処理 */
    document.getElementById("change-theme-btn").addEventListener("click", () => {
        const list = document.getElementById("theme-options-list");
        list.innerHTML = "";

        // 所持王冠数以下のデザインのみをリスト化
        camoLevels.forEach(camo => {
            if (camo.level <= userCrownCount) {
                const item = document.createElement("div");
                item.className = `camo-option ${selectedLevel === camo.level ? 'active' : ''}`;
                item.innerHTML = `<span>${camo.name}</span> ${selectedLevel === camo.level ? '✓' : ''}`;
                item.onclick = () => {
                    selectedLevel = camo.level;
                    applyStyleByLevel(selectedLevel);
                    document.getElementById("change-theme-btn").click(); // 表示更新
                };
                list.appendChild(item);
            }
        });

        document.getElementById("theme-modal").style.display = "flex";
    });

    document.getElementById("close-theme-btn").addEventListener("click", () => {
        document.getElementById("theme-modal").style.display = "none";
    });

    /* ログイン / ログアウト */
    const provider = new GoogleAuthProvider();
    document.getElementById("login-btn").addEventListener("click", () => signInWithPopup(auth, provider));
    document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

    /* スタートボタン */
    document.getElementById("start-btn").addEventListener("click", () => {
        const unit = document.getElementById("select-unit").value;
        const count = document.getElementById("select-count").value;
        alert(`クイズを開始します！\n単元: ${unit}\n問題数: ${count}`);
        // ここに既存のクイズ画面遷移ロジックを記述してください
    });

    /* 🕹️ デバッグキー操作 (dキー3回連打) */
    let keyHistory = [];
    document.addEventListener("keydown", (e) => {
        if (e.key.toLowerCase() === "d") {
            const now = Date.now();
            keyHistory.push(now);
            keyHistory = keyHistory.filter(t => now - t < 1000);
            if (keyHistory.length >= 3) {
                const panel = document.getElementById("debug-panel");
                panel.style.display = panel.style.display === "none" || panel.style.display === "" ? "block" : "none";
                keyHistory = [];
            }
        }
    });
</script>
</body>
</html>
